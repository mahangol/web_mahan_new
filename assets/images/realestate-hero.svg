<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="re-hero-title">
  <title id="re-hero-title">نمای معماری لوکس مشاورین املاک ماهان</title>
  <defs>
    <linearGradient id="reBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#0E2544"/>
      <stop offset="100%" stop-color="#061426"/>
    </linearGradient>
    <linearGradient id="reGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7C25C"/>
      <stop offset="100%" stop-color="#BF9200"/>
    </linearGradient>
    <linearGradient id="reFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#061426" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="reGlow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#E7C25C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E7C25C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#reBg)"/>
  <rect width="1600" height="1000" fill="url(#reGlow)"/>

  <!-- fine grid, evokes architectural blueprint -->
  <g stroke="#E7C25C" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1600 M0 200H1600 M0 300H1600 M0 400H1600 M0 500H1600 M0 600H1600 M0 700H1600 M0 800H1600 M0 900H1600"/>
    <path d="M100 0V1000 M300 0V1000 M500 0V1000 M700 0V1000 M900 0V1000 M1100 0V1000 M1300 0V1000 M1500 0V1000"/>
  </g>

  <!-- skyline silhouette -->
  <g opacity="0.9">
    <rect x="120" y="620" width="90" height="380" fill="#0F2A4E"/>
    <rect x="230" y="520" width="70" height="480" fill="#12305A"/>
    <rect x="320" y="700" width="110" height="300" fill="#0F2A4E"/>
    <rect x="450" y="440" width="85" height="560" fill="#15376A"/>
    <rect x="555" y="600" width="60" height="400" fill="#0F2A4E"/>
    <rect x="640" y="340" width="100" height="660" fill="#17406F"/>
    <rect x="760" y="560" width="75" height="440" fill="#12305A"/>
    <rect x="855" y="480" width="90" height="520" fill="#15376A"/>
    <rect x="965" y="640" width="65" height="360" fill="#0F2A4E"/>
    <rect x="1050" y="380" width="95" height="620" fill="#17406F"/>
    <rect x="1165" y="580" width="80" height="420" fill="#12305A"/>
    <rect x="1265" y="500" width="70" height="500" fill="#15376A"/>
    <rect x="1355" y="660" width="100" height="340" fill="#0F2A4E"/>
    <rect x="1475" y="440" width="80" height="560" fill="#17406F"/>
  </g>

  <!-- gold window accents -->
  <g fill="url(#reGold)" opacity="0.85">
    <rect x="145" y="660" width="10" height="14"/>
    <rect x="175" y="660" width="10" height="14"/>
    <rect x="145" y="700" width="10" height="14"/>
    <rect x="255" y="560" width="10" height="14"/>
    <rect x="255" y="600" width="10" height="14"/>
    <rect x="475" y="480" width="10" height="14"/>
    <rect x="505" y="480" width="10" height="14"/>
    <rect x="475" y="520" width="10" height="14"/>
    <rect x="670" y="390" width="10" height="14"/>
    <rect x="700" y="390" width="10" height="14"/>
    <rect x="670" y="430" width="10" height="14"/>
    <rect x="700" y="430" width="10" height="14"/>
    <rect x="880" y="520" width="10" height="14"/>
    <rect x="910" y="520" width="10" height="14"/>
    <rect x="1080" y="420" width="10" height="14"/>
    <rect x="1110" y="420" width="10" height="14"/>
    <rect x="1080" y="460" width="10" height="14"/>
    <rect x="1290" y="540" width="10" height="14"/>
    <rect x="1500" y="480" width="10" height="14"/>
    <rect x="1500" y="520" width="10" height="14"/>
  </g>

  <!-- gold roofline accent on the tallest tower -->
  <path d="M640 340L690 300L740 340" fill="none" stroke="url(#reGold)" stroke-width="3"/>
  <path d="M1050 380L1097 345L1145 380" fill="none" stroke="url(#reGold)" stroke-width="3"/>

  <!-- horizon glow line -->
  <rect x="0" y="998" width="1600" height="2" fill="url(#reGold)" opacity="0.5"/>

  <!-- foreground fade so text stays legible on the right/left depending on layout -->
  <rect width="1600" height="1000" fill="url(#reFade)"/>
</svg>
